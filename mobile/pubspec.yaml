name: inksight
description: AR Tattoo Preview Platform — project, scale, and blend tattoo designs onto skin in real-time.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Networking ---
  dio: ^5.4.0
  retrofit: ^4.1.0

  # --- QR / Camera ---
  mobile_scanner: ^5.1.1

  # --- Security ---
  flutter_secure_storage: ^9.0.0

  # --- Gesture Detection ---
  gesture_x_detector: ^1.1.1

  # --- Image Processing ---
  image: ^4.1.7

  # --- Utilities ---
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  vector_math: ^2.1.4
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/multiply_blend.frag

  assets:
    - assets/images/
    - assets/icons/
